# Dbscript 4 — deny HTTP access to runtime directories (Docker dev).
# Production Apache example: deploy/apache-site.conf.example

<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/_(conf|logs|local|data)">
    Require all denied
</DirectoryMatch>
