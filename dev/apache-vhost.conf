# Dbscript 4 — deny HTTP access to runtime directories (Docker dev).
# Production Apache example: deploy/apache-site.conf.example

<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    RewriteEngine On
    RewriteRule ^api/v1/ api/index.php [L,QSA]
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</Directory>

<DirectoryMatch "^/var/www/html/_(conf|logs|local|data)">
    Require all denied
</DirectoryMatch>

Alias /app /var/www/html/public/app
<Directory /var/www/html/public/app>
    Options -Indexes
    Require all granted
    FallbackResource /app/index.html
</Directory>
