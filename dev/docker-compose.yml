services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
      - ./apache-vhost.conf:/etc/apache2/conf-available/dbscript.conf:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html
      DBSCRIPT_DEV_NO_FLOCK: "1"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dbscript_root
      MYSQL_DATABASE: dbscript_test
    ports:
      - "3307:3306"
    volumes:
      - dbscript_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdbscript_root"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbscript_mysql_data:
