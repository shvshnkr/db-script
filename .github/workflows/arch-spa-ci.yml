name: arch-spa CI

on:
  push:
    branches: [arch-spa]
  pull_request:
    branches: [arch-spa, arch-modern]

jobs:
  verify-l0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash scripts/verify.sh

  php-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction
      - run: vendor/bin/phpunit --testsuite unit

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build

  smoke-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f dev/docker-compose.yml up -d --build
      - run: docker compose -f dev/docker-compose.yml exec -T web bash -c 'composer update --no-interaction && php scripts/arch-modern-install-dev.php testpass12 && php scripts/arch-modern-seed-demo.php && vendor/bin/phpunit --testsuite unit && bash scripts/smoke-all-spa.sh http://127.0.0.1'
