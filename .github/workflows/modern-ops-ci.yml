name: modern-ops CI

on:
  push:
    branches: [modern-ops]
  pull_request:
    branches: [modern-ops, php8-port]

jobs:
  verify-l0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash scripts/verify.sh

  php-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction
      - run: vendor/bin/phpunit --testsuite unit

  servicectl-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, debian:11, debian:12]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y bash shellcheck
      - run: chmod +x scripts/dbs-servicectl.sh tests/servicectl/mock-bin/systemctl tests/servicectl/run-matrix.sh
      - run: shellcheck -x scripts/dbs-servicectl.sh
      - run: bash tests/servicectl/run-matrix.sh

  smoke-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f dev/docker-compose.yml up -d --build
      - run: docker compose -f dev/docker-compose.yml exec -T web bash -c 'composer install --no-interaction && bash scripts/smoke-all.sh http://127.0.0.1 /var/www/html'
        env:
          SMOKE_SKIP_INSTALL: "1"
